<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071D49" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      html,body{margin:0;min-height:100%;background:#17365f}
      #startup-splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#17365f;color:#fffaf0;font-family:Georgia,serif;text-align:center}
      #startup-splash img{width:min(34vw,150px);height:min(34vw,150px);object-fit:cover;border-radius:50%;border:4px solid #c49a50}
      #startup-splash strong{font-size:clamp(28px,7vw,38px)}
      #startup-splash span{font:12px system-ui,sans-serif;letter-spacing:.08em;color:#ead8b6}
    </style>
    <meta name="description" content="English learning app for the Egyptian curriculum with source-based textbooks, lesson units, and interactive practice." />
    <meta property="og:title" content="EngliMensh" />
    <meta property="og:description" content="English learning app for the Egyptian curriculum with source-based textbooks, lesson units, and interactive practice." />
    <title>EngliMensh</title>
  </head>
  <body>
    <div id="startup-splash" role="status" aria-label="Welcome to EngliMensh"><img src="/assets/teacher-portrait.jpeg" alt="EngliMensh teacher"><strong>EngliMensh</strong><span>Learn · Practice · Achieve</span></div>
    <div id="app"></div>
    <script>window.addEventListener("load",()=>{const splash=document.getElementById("startup-splash");if(splash){window.setTimeout(()=>{splash.classList.add("startup-splash-hide");window.setTimeout(()=>splash.remove(),350)},2000)}});</script>
    <script>
      (() => {
        const showStartupError = (message) => {
          const root = document.getElementById('app');
          if (!root || root.dataset.startupError === 'shown') return;
          root.dataset.startupError = 'shown';
          root.innerHTML = '<main style="min-height:100vh;display:grid;place-content:center;padding:28px;font-family:system-ui,sans-serif;background:#f4f7fc;color:#172b42;text-align:center"><h2 style="margin:0 0 12px">تعذر تشغيل التطبيق</h2><p style="max-width:560px;line-height:1.7">حدث خطأ أثناء تحميل التطبيق. أعد فتحه بعد قليل. إذا استمرت المشكلة، أرسل نص الخطأ التالي للدعم:</p><pre id="startup-error-detail" style="white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;background:#fff;padding:14px;border-radius:10px;border:1px solid #ddd"></pre></main>';
          const detail = document.getElementById('startup-error-detail');
          if (detail) detail.textContent = String(message || 'Unknown startup error');
        };
        window.addEventListener('error', (event) => showStartupError(event.message || event.error || 'Script loading error'));
        window.addEventListener('unhandledrejection', (event) => showStartupError(event.reason?.stack || event.reason || 'Unhandled promise rejection'));
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
