name: Enrich preparatory vocabulary images only

on:
  push:
    branches:
      - 'images/**'

permissions:
  contents: write

concurrency:
  group: vocabulary-images-only
  cancel-in-progress: false

jobs:
  fetch-and-save-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout image-enrichment branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch licensed vocabulary images and generate image map
        env:
          FETCH_PREPARATORY_IMAGES: '1'
        run: node scripts/build-preparatory-vocabulary.mjs

      - name: Create image-enrichment report
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data = JSON.parse(fs.readFileSync('src/data/preparatory-vocabulary.json', 'utf8'));
          const report = data.imageReport;
          const lines = [
            '# Preparatory vocabulary image enrichment report',
            '',
            '- Units parsed: ' + report.units,
            '- Vocabulary records: ' + report.words,
            '- New licensed photos downloaded: ' + report.photosDownloaded,\n            '- From Openverse: ' + report.openversePhotosDownloaded,\n            '- From Wikimedia Commons: ' + report.wikimediaPhotosDownloaded,
            '- Words still without a photo: ' + report.imagesMissing,
            '- Scope: image retrieval and vocabulary image mapping only; no tests, app build, or APK build.',
            '',
            '## Unit-level image inventory',
            ''
          ];
          for (const [key, unit] of Object.entries(data.units)) {
            const photos = unit.words.filter(x => x.imageType === 'photo').length;
            const svg = unit.words.filter(x => x.imageType === 'svg-illustration').length;
            const missing = unit.words.filter(x => x.imageType === 'missing').length;
            lines.push('- ' + key + ': ' + unit.words.length + ' words; ' + photos + ' photos; ' + svg + ' SVG illustrations; ' + missing + ' missing.');
          }
          fs.writeFileSync('vocabulary-image-report.md', lines.join('\n') + '\n');
          NODE

      - name: Commit only vocabulary photos and their data map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/preparatory-vocabulary src/data/preparatory-vocabulary.json
          if git diff --cached --quiet; then
            echo "No vocabulary image assets or mapping changes to commit."
          else
            git commit -m "Add licensed preparatory vocabulary photos"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload image report
        uses: actions/upload-artifact@v4
        with:
          name: preparatory-vocabulary-image-report
          path: vocabulary-image-report.md
          if-no-files-found: error
          retention-days: 30
