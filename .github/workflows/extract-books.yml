name: Extract source books

on:
  workflow_dispatch:
    inputs:
      publish_artifact:
        description: Upload extracted page text and manifest as a workflow artifact
        required: true
        type: boolean
        default: true
  push:
    branches: [feature/primary-connect-connect-plus-2026-2027]
    paths:
      - '.github/workflows/extract-books.yml'
      - 'public/books/**'
      - 'scripts/extract-pdfs.mjs'
      - 'scripts/ocr-scanned-pages.py'

permissions:
  contents: read

concurrency:
  group: extract-source-books
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository and hydrate Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Diagnose and pull Git LFS objects
        shell: bash
        run: |
          set -euxo pipefail
          git lfs version
          git lfs env
          git lfs ls-files -l
          git lfs pull
          echo "LFS pull completed; checking assessment PDF signatures"
          python3 - <<'PY'
          from pathlib import Path
          import sys
          names = [
              "English_prim1_t1_Assmt (1).pdf",
              "English_prim2_t1_Assmt (1).pdf",
              "English_prim4_t1_Assmt (1).pdf",
              "English_prim5_t1_Assmt (1).pdf",
              "English_prim6_t1_Assmt (1).pdf",
              "كتاب تقييمات الصف الثالث 2026.pdf",
          ]
          missing = []
          for name in names:
              path = Path("public/books") / name
              if not path.is_file():
                  missing.append(f"{name}: file missing")
                  continue
              head = path.read_bytes()[:256]
              if b"git-lfs.github.com/spec" in head:
                  missing.append(f"{name}: Git LFS pointer remains (object not hydrated)")
              elif not head.startswith(b"%PDF-"):
                  missing.append(f"{name}: invalid PDF signature")
              else:
                  print(f"READY: {name}")
          if missing:
              print("::error::Assessment source PDFs are unavailable:")
              for item in missing:
                  print(f" - {item}")
              sys.exit(1)
          PY

      - name: Confirm source PDFs are hydrated
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          pdfs = sorted(Path("public/books").rglob("*"))
          pdfs = [p for p in pdfs if p.is_file() and p.suffix.lower() == ".pdf"]
          if not pdfs:
              print("::error::No PDF files found under public/books")
              sys.exit(1)

          pointers = []
          for path in pdfs:
              with path.open("rb") as stream:
                  header = stream.read(256)
              if b"git-lfs.github.com/spec" in header:
                  pointers.append(path)
              elif not header.startswith(b"%PDF-"):
                  print(f"::warning file={path}::File does not begin with a PDF signature; extractor will report it")

          if pointers:
              print(f"::warning::Found {len(pointers)} Git LFS pointer file(s). The extractor is designed to skip these and record them in manifest.json:")
              for path in pointers:
                  print(f" - {path}")
          hydrated = len(pdfs) - len(pointers)
          print(f"Found {len(pdfs)} PDF entries: {hydrated} hydrated, {len(pointers)} unavailable LFS pointer(s). Continuing with available books.")
          PY

      - name: Extract page-level text
        run: npm run extract:books

      - name: Install OCR engine and languages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pymupdf

      - name: OCR pages without extractable text
        env:
          OCR_LANG: eng+ara
          OCR_DPI: "150"
          OCR_WORKERS: "6"
          OCR_CHECKPOINT_EVERY: "25"
          OCR_PAGE_TIMEOUT: "30"
        run: .venv/bin/python scripts/ocr-scanned-pages.py

      - name: Validate provenance and review status
        run: npm run validate:extraction

      - name: Validate supplemental manual OCR recoveries
        run: npm run validate:manual-recoveries

      - name: Upload extraction results
        if: ${{ inputs.publish_artifact || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: englimensh-extracted-books
          path: |
            src/data/extracted/pages.jsonl
            src/data/extracted/manifest.json
          if-no-files-found: error
          retention-days: 14
