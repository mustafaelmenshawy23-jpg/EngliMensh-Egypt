name: Extract source books

on:
  workflow_dispatch:
    inputs:
      publish_artifact:
        description: Upload extracted page text and manifest as a workflow artifact
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: extract-source-books
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository and hydrate Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Pull Git LFS objects explicitly
        run: git lfs pull

      - name: Confirm source PDFs are hydrated
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          pdfs = sorted(Path("public/books").rglob("*"))
          pdfs = [p for p in pdfs if p.is_file() and p.suffix.lower() == ".pdf"]
          if not pdfs:
              print("::error::No PDF files found under public/books")
              sys.exit(1)

          pointers = []
          for path in pdfs:
              with path.open("rb") as stream:
                  header = stream.read(256)
              if b"git-lfs.github.com/spec" in header:
                  pointers.append(path)
              elif not header.startswith(b"%PDF-"):
                  print(f"::warning file={path}::File does not begin with a PDF signature; extractor will report it")

          if pointers:
              print(f"::warning::Found {len(pointers)} Git LFS pointer file(s). The extractor is designed to skip these and record them in manifest.json:")
              for path in pointers:
                  print(f" - {path}")
          hydrated = len(pdfs) - len(pointers)
          print(f"Found {len(pdfs)} PDF entries: {hydrated} hydrated, {len(pointers)} unavailable LFS pointer(s). Continuing with available books.")
          PY

      - name: Extract page-level text
        run: npm run extract:books

      - name: Install OCR engine and languages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pymupdf

      - name: OCR pages without extractable text
        env:
          OCR_LANG: eng+ara
          OCR_DPI: "130"
          OCR_WORKERS: "6"
          OCR_CHECKPOINT_EVERY: "25"
          OCR_PAGE_TIMEOUT: "60"
        run: .venv/bin/python scripts/ocr-scanned-pages.py

      - name: Validate provenance and review status
        run: npm run validate:extraction

      - name: Upload extraction results
        if: ${{ inputs.publish_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: englimensh-extracted-books
          path: |
            src/data/extracted/pages.jsonl
            src/data/extracted/manifest.json
          if-no-files-found: error
          retention-days: 14
