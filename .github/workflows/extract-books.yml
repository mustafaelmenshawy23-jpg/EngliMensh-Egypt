name: Extract source books

on:
  workflow_dispatch:
    inputs:
      publish_artifact:
        description: Upload extracted page text and manifest as a workflow artifact
        required: true
        type: boolean
        default: true
  push:
    branches: [feature/primary-connect-connect-plus-2026-2027]
    paths:
      - '.github/workflows/extract-books.yml'
      - 'public/books/**'
      - 'scripts/extract-pdfs.mjs'
      - 'scripts/ocr-scanned-pages.py'

permissions:
  contents: read

concurrency:
  group: extract-source-books
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository without automatic LFS smudge
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Attempt Git LFS hydration and inventory every source PDF
        shell: bash
        run: |
          set -u
          git lfs version
          git lfs ls-files -l || true
          if ! git lfs pull; then
            echo "::warning::One or more Git LFS objects could not be hydrated. Continuing with every available PDF and recording unavailable pointers."
          fi
          python3 - <<'PY'
          from pathlib import Path
          pdfs = sorted(p for p in Path("public/books").rglob("*") if p.is_file() and p.suffix.lower() == ".pdf")
          ready = []
          pointers = []
          invalid = []
          for path in pdfs:
              head = path.read_bytes()[:256]
              if head.startswith(b"%PDF-"):
                  ready.append(path)
              elif b"git-lfs.github.com/spec" in head:
                  pointers.append(path)
              else:
                  invalid.append(path)
          print(f"PDF entries: {len(pdfs)}")
          print(f"Hydrated PDFs: {len(ready)}")
          print(f"Unhydrated LFS pointers: {len(pointers)}")
          print(f"Invalid/non-PDF files: {len(invalid)}")
          for path in pointers:
              print(f"::warning file={path}::LFS object unavailable in this run; source is retained unchanged")
          for path in invalid:
              print(f"::warning file={path}::File does not have a PDF signature")
          PY

      - name: Extract page-level text from every available PDF
        run: npm run extract:books

      - name: Install OCR engine and languages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pymupdf

      - name: OCR pages without extractable text (resumable checkpoints)
        env:
          OCR_LANG: eng+ara
          OCR_DPI: "150"
          OCR_WORKERS: "6"
          OCR_CHECKPOINT_EVERY: "25"
          OCR_PAGE_TIMEOUT: "30"
        shell: bash
        run: |
          if [ -s src/data/extracted/pages.jsonl ]; then
            .venv/bin/python scripts/ocr-scanned-pages.py
          else
            echo "::warning::No hydrated PDF pages were available for OCR. The manifest still records the source PDF/LFS inventory."
          fi

      - name: Validate provenance and review status
        run: npm run validate:extraction

      - name: Validate supplemental manual OCR recoveries
        run: npm run validate:manual-recoveries

      - name: Upload extraction results, including partial inventories
        if: always() && (inputs.publish_artifact || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: englimensh-extracted-books
          path: |
            src/data/extracted/pages.jsonl
            src/data/extracted/manifest.json
          if-no-files-found: warn
          retention-days: 14
