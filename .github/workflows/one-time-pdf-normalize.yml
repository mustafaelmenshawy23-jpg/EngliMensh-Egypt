name: One-time store Prep 2 PDF as normal Git blob
on:
  push:
    paths:
      - ".github/workflows/one-time-pdf-normalize.yml"
    branches:
      - main
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Hydrate and verify original PDF
        shell: bash
        run: |
          set -euo pipefail
          FILE="public/books/Performance Tasks Prep 2-OnlineMaterials.PDF"
          test -f "$FILE"
          echo "ACTUAL_SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)"
          echo "ACTUAL_SIZE=$(stat -c%s "$FILE")"
          file "$FILE"
          git lfs ls-files -l | grep -F "Performance Tasks Prep 2-OnlineMaterials.PDF" || true
          test "$(sha256sum "$FILE" | cut -d' ' -f1)" = "3965c782dc0f2d4cb79515e8981c4b07d88fc768cb1087d616d91cb02e845618"
          printf '%s -filter -diff -merge -text\n' "$FILE" >> .git/info/attributes
          git add -- "$FILE"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Store Performance Tasks Prep 2 PDF as regular Git blob"
          git push origin HEAD:main
