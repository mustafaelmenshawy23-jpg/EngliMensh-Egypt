name: Render manual recovery source context

on:
  push:
    branches: [main]
    paths:
      - "scripts/render-manual-recovery-context.py"
      - "src/data/extracted/manual-recovery-candidates.json"
      - ".github/workflows/render-manual-recovery-context.yml"
  workflow_dispatch:
    inputs:
      dpi:
        description: Render resolution
        required: true
        type: choice
        options: ["200", "240", "300"]
        default: "240"
      context_radius:
        description: Number of physical pages before and after each candidate
        required: true
        type: choice
        options: ["1", "2"]
        default: "1"

permissions:
  contents: read

concurrency:
  group: manual-recovery-context-review
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout and hydrate original source PDFs
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Pull Git LFS objects
        run: git lfs pull
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF renderer
        run: python -m pip install --no-cache-dir pymupdf
      - name: Render candidate pages and adjacent context
        env:
          RENDER_DPI: ${{ inputs.dpi || '240' }}
          CONTEXT_RADIUS: ${{ inputs.context_radius || '1' }}
        run: python scripts/render-manual-recovery-context.py
      - name: Upload contextual source review images
        uses: actions/upload-artifact@v4
        with:
          name: englimensh-manual-recovery-context-${{ inputs.dpi || '240' }}dpi
          path: review-pages-manual-context/
          if-no-files-found: error
          retention-days: 14
