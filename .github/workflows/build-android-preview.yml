name: Build EngliMensh Android preview APK

on:
  push:
    branches: [main, feature/primary-connect-connect-plus-2026-2027, feature/official-app-icon-setup-2026-11-09]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository and hydrate original source PDFs
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed

      - name: Install dependencies
        run: npm install

      - name: Run automated application and unit tests
        run: npm test

      - name: Install image tooling for approved app icon
        run: python3 -m pip install --user Pillow

      - name: Keep original PDFs remote to avoid embedding 1.6 GB in the APK
        run: rm -rf public/books

      - name: Build web application with remote original source PDFs
        env:
          VITE_BOOKS_BASE_URL: https://media.githubusercontent.com/media/mustafaelmenshawy23-jpg/EngliMensh-Egypt/main/public/books/
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Generate official Android and PWA icons
        run: python3 scripts/prepare-official-app-icons.py

      - name: Sync web application into Android project
        run: npx cap sync android

      - name: Install Gradle directly on the runner
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build installable debug APK
        working-directory: android
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" assembleDebug

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: EngliMensh-Egypt-preview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
