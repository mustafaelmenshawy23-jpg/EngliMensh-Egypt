name: Build EngliMensh Android preview APK

# APK builds are intentionally deferred until the preparatory curriculum is complete.
# Keep release builds on main or an explicit manual request; PR updates run validation only.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository and hydrate original source PDFs
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed

      - name: Install dependencies
        run: npm install
      - name: Prepare official PWA icons from the selected source artwork
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python -m py_compile scripts/prepare-app-icons.py
          python scripts/prepare-app-icons.py --web
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          icons = Path("public/icons")
          for size in (192, 512):
              path = icons / f"englimensh-icon-{size}.png"
              assert path.is_file() and path.stat().st_size > 0, f"Missing generated PWA icon: {path}"
              with Image.open(path) as image:
                  assert image.format == "PNG" and image.size == (size, size), f"Invalid PWA icon dimensions: {path}"
          print("Verified exact-source PWA icons at 192px and 512px.")
          PY

      - name: Keep original PDFs remote to avoid embedding 1.6 GB in the APK
        run: rm -rf public/books

      - name: Build web application with remote original source PDFs (image enrichment runs separately)
        env:
          VITE_BOOKS_BASE_URL: https://media.githubusercontent.com/media/mustafaelmenshawy23-jpg/EngliMensh-Egypt/main/public/books/
        run: npm run build

      - name: Generate Android project
        run: npx cap add android
      - name: Register native certificate Downloads bridge
        run: node scripts/prepare-android-downloads.mjs

      - name: Apply official Android launcher and adaptive icons
        run: python scripts/prepare-app-icons.py --android
      - name: Verify Android launcher and adaptive icon assets
        run: |
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          test -s android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          echo "Verified Android launcher, round and adaptive icon assets."

      - name: Sync web application into Android project
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        run: ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" assembleDebug

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: EngliMensh-Egypt-preview-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
