name: Enrich preparatory vocabulary images

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: preparatory-vocabulary-images-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  enrich-images:
    # This workflow is deliberately image-only for the current work phase.
    # Do not run curriculum tests, academic checks, WebView checks, or APK builds here.
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the PR branch (or manually selected working branch)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download openly licensed vocabulary images
        env:
          FETCH_PREPARATORY_IMAGES: '1'
        run: node scripts/build-preparatory-vocabulary.mjs

      - name: Save downloaded images and vocabulary image metadata to the branch
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/preparatory-vocabulary src/data/preparatory-vocabulary.json
          if git diff --cached --quiet; then
            echo "No new vocabulary image files or metadata changes to save."
          else
            git commit -m "Add openly licensed preparatory vocabulary images"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi
