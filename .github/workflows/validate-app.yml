name: Validate EngliMensh app

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and validate Git LFS pointers without downloading the PDFs
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Install dependencies
        run: npm install
      - name: Prepare official PWA icons from the selected source artwork
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python -m py_compile scripts/prepare-app-icons.py
          python scripts/prepare-app-icons.py --web

      - name: Validate source-book index and original PDFs
        run: npm run validate:source-index

      - name: Validate source-linked review candidates
        run: npm run validate:review-candidates

      - name: Validate Pass 22 high-resolution visual observations
        run: npm run validate:visual-recoveries-pass22

      - name: Validate source-linked lesson content
        run: npm run validate:lesson-content

      - name: Validate independent unit module scaffolds
        run: npm run validate:unit-modules

      - name: Check JavaScript generator syntax
        run: |
          node --check scripts/generate-interactive-unit.mjs
          node --check scripts/generate-interactive-curriculum-batch.mjs
          node --check scripts/build-preparatory-vocabulary.mjs

      - name: Run automated application and unit tests
        run: npm test

      - name: Build application
        env:
          SKIP_PREPARATORY_IMAGE_FETCH: '1'
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: englimensh-egypt-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
