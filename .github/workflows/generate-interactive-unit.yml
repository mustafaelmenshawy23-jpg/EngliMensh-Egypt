name: Generate interactive curriculum batch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-interactive-curriculum-batch.mjs'
      - 'scripts/extract-pdfs.mjs'
      - 'scripts/ocr-scanned-pages.py'
      - 'scripts/build-source-review-queue.mjs'
      - 'scripts/lib/source-review-queue.mjs'
      - 'scripts/repair-watermark-pages.mjs'
      - 'scripts/lib/extraction-quality.mjs'
      - 'scripts/lib/extraction-cache-health.mjs'
      - 'scripts/lib/curriculum-batch-progress.mjs'
      - 'scripts/lib/gemini-config.mjs'
      - 'scripts/lib/interactive-unit-schema.mjs'
      - 'scripts/test-interactive-unit-schema.mjs'
      - 'scripts/test-gemini-config.mjs'
      - 'artifacts/unit-drafts/batch-trigger.json'
      - 'scripts/test-source-review-queue.mjs'
      - 'scripts/check-extraction-cache.mjs'
      - 'scripts/generate-interactive-unit.mjs'
      - 'scripts/lib/curriculum-order.mjs'
      - 'scripts/lib/source-quality-gate.mjs'
      - 'scripts/test-source-quality-gate.mjs'
      - 'scripts/lib/content-quality-validator.mjs'
      - 'data/curriculum/source-book-index.draft.json'
      - 'src/data/extracted/manifest.json'
      - 'src/data/extracted/pages.jsonl'
      - '.github/workflows/generate-interactive-unit.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      start_index:
        description: Optional zero-based position in the ordered candidate queue; leave empty to resume saved progress
        required: false
        default: ""
        type: string
      batch_size:
        description: Number of units to process in this run (1-10)
        required: true
        default: "10"
        type: string
      chain_depth:
        description: Internal safety counter for automatic resumable batches
        required: false
        default: "0"
        type: string
      gemini_model:
        description: Gemini model
        required: true
        default: gemini-3.8-flash
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: englimensh-curriculum-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout only the EngliMensh-Egypt repository and hydrate source PDFs
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Preflight curriculum generation syntax
        run: |
          node --check scripts/generate-interactive-unit.mjs
          node --check scripts/generate-interactive-curriculum-batch.mjs

      - name: Restore reusable source extraction cache
        id: source_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/data/extracted/pages.jsonl
            src/data/extracted/manifest.json
            artifacts/source-review-queue.json
            artifacts/source-review-queue.md
          key: englimensh-source-extraction-fullcoverage-v2-${{ hashFiles('public/books/**', 'scripts/extract-pdfs.mjs', 'scripts/ocr-scanned-pages.py', 'scripts/repair-watermark-pages.mjs', 'scripts/lib/extraction-cache-health.mjs', 'scripts/check-extraction-cache.mjs') }}
          restore-keys: |
            englimensh-source-extraction-

      - name: Assess restored extraction cache coverage
        id: extraction_coverage
        run: node scripts/check-extraction-cache.mjs

      - name: Hydrate every original source PDF when cache is incomplete
        if: steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: |
          set -euo pipefail
          if ! git lfs pull; then
            echo "::warning::One or more LFS objects could not be downloaded. Continuing with readable PDFs; missing objects will be recorded as blocked sources."
          fi
          python3 - <<'PY'
          from pathlib import Path
          import sys

          pdfs = sorted(p for p in Path("public/books").rglob("*") if p.is_file() and p.suffix.lower() == ".pdf")
          pointers = []
          invalid = []
          for path in pdfs:
              header = path.read_bytes()[:256]
              if b"git-lfs.github.com/spec" in header:
                  pointers.append(str(path))
              elif not header.startswith(b"%PDF-"):
                  invalid.append(str(path))
          if invalid:
              print(f"::error::Found {len(invalid)} invalid PDF file(s); refusing to extract corrupted sources.")
              for path in invalid[:20]:
                  print(" - Invalid PDF: " + path)
              sys.exit(1)
          if pointers:
              print(f"::warning::Continuing with {len(pdfs) - len(pointers)} hydrated PDF(s); {len(pointers)} source(s) remain blocked by missing LFS objects.")
              for path in pointers:
                  print(" - Blocked LFS source: " + path)
          else:
              print(f"All {len(pdfs)} source PDF files are hydrated and begin with a PDF signature.")
          PY

      - name: Extract all source pages when cache is incomplete
        if: steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: npm run extract:books

      - name: Verify full source extraction coverage
        if: steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: node scripts/check-extraction-cache.mjs --require-complete

      - name: Detect repeated watermark-only text pages
        if: steps.source_cache.outputs.cache-hit != 'true' || steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: node scripts/repair-watermark-pages.mjs

      - name: Hydrate only PDFs with watermark-only pages from a restored cache
        if: steps.extraction_coverage.outputs.needs_full_extraction != 'true' && steps.source_cache.outputs.cache-matched-key != '' && steps.source_cache.outputs.cache-hit != 'true'
        run: |
          sources="$(cat src/data/extracted/watermark-repair-sources.txt src/data/extracted/ocr-retry-sources.txt 2>/dev/null | sed '/^$/d' | sort -u || true)"
          if [ -n "$sources" ]; then
            include="$(printf '%s\n' "$sources" | paste -sd, -)"
            if ! git lfs pull --include="$include"; then
              echo "::warning::Some PDFs needed for OCR retry could not be hydrated; their pages will remain explicitly blocked for visual review."
            fi
          else
            echo "No additional source PDFs are required for OCR retry."
          fi

      - name: Set up OCR tools for scanned and watermark-only pages
        if: steps.source_cache.outputs.cache-hit != 'true' || steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
          python3 -m venv .venv
          .venv/bin/pip install pymupdf

      - name: OCR scanned and watermark-only pages
        if: steps.source_cache.outputs.cache-hit != 'true' || steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: OCR_LANG=eng+ara OCR_DPI=300 OCR_WORKERS=4 OCR_CHECKPOINT_EVERY=10 OCR_RETRY_EMPTY=1 OCR_PSMS=6,11,3 OCR_PAGE_TIMEOUT=45 .venv/bin/python scripts/ocr-scanned-pages.py

      - name: Validate complete source extraction before generation
        if: steps.source_cache.outputs.cache-hit != 'true' || steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: |
          npm run validate:extraction
          node scripts/check-extraction-cache.mjs --require-complete

      - name: Build source visual-review queue
        if: steps.source_cache.outputs.cache-hit != 'true' || steps.extraction_coverage.outputs.needs_full_extraction == 'true' || hashFiles('artifacts/source-review-queue.json') == ''
        run: node scripts/build-source-review-queue.mjs

      - name: Save reusable source extraction cache
        if: steps.source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src/data/extracted/pages.jsonl
            src/data/extracted/manifest.json
            artifacts/source-review-queue.json
            artifacts/source-review-queue.md
          key: ${{ steps.source_cache.outputs.cache-primary-key }}

      - name: Resolve resumable chain depth
        id: batch_chain
        shell: bash
        run: |
          DEPTH="${{ github.event.inputs.chain_depth || '0' }}"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            MESSAGE="$(node -e 'const fs=require("node:fs"); const event=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8")); process.stdout.write(event.head_commit?.message || "");')"
            if [ "$MESSAGE" = "Auto-continue curriculum batch" ] && [ -f artifacts/unit-drafts/batch-trigger.json ]; then
              DEPTH="$(node -e 'const fs=require("node:fs"); const state=JSON.parse(fs.readFileSync("artifacts/unit-drafts/batch-trigger.json","utf8")); process.stdout.write(String(Number(state.chainDepth || 0)));')"
            else
              DEPTH=0
            fi
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            DEPTH=0
          fi
          echo "value=$DEPTH" >> "$GITHUB_OUTPUT"

      - name: Generate resumable ordered unit batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GEMINI_API_KEY_BACKUP_2: ${{ secrets.GEMINI_API_KEY_BACKUP_2 }}
          GEMINI_API_KEY_BACKUP_3: ${{ secrets.GEMINI_API_KEY_BACKUP_3 }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || 'gemini-3.8-flash' }}
          START_INDEX: ${{ github.event.inputs.start_index || '' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
          CHAIN_DEPTH: ${{ steps.batch_chain.outputs.value || '0' }}
        run: node scripts/generate-interactive-curriculum-batch.mjs

      - name: Persist unapproved drafts and resumable queue state
        if: always()
        run: |
          set -e
          EXTRACTION_BACKUP="$RUNNER_TEMP/englimensh-extracted"
          restore_extraction() {
            if [ -d "$EXTRACTION_BACKUP" ]; then
              mkdir -p src/data/extracted
              cp -a "$EXTRACTION_BACKUP/." src/data/extracted/
            fi
          }
          trap restore_extraction EXIT

          if [ -d src/data/extracted ]; then
            rm -rf "$EXTRACTION_BACKUP"
            mkdir -p "$EXTRACTION_BACKUP"
            cp -a src/data/extracted/. "$EXTRACTION_BACKUP/"
            rm -rf src/data/extracted
            # Restore the committed extraction snapshot before rebasing.
            # The fresh extraction is kept in RUNNER_TEMP and restored by the EXIT trap.
            git restore --source=HEAD --staged --worktree -- src/data/extracted/ || true
            git clean -fd -- src/data/extracted/ || true
          fi

          if [ -d artifacts/unit-drafts ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add artifacts/unit-drafts/*.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              if git diff --cached --name-only | grep -qx 'artifacts/unit-drafts/batch-trigger.json'; then
                git commit -m "Auto-continue curriculum batch"
              else
                git commit -m "Save resumable interactive curriculum batch"
              fi
              git pull --rebase origin main
              git push
            else
              echo "No draft/progress/state changes to persist."
            fi
          fi

      - name: Upload drafts, blockers, and progress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-curriculum-batch-${{ github.run_number }}
          path: |
            artifacts/unit-drafts/*.json
            src/data/extracted/pages.jsonl
            src/data/extracted/manifest.json
            artifacts/source-review-queue.json
            artifacts/source-review-queue.md
          if-no-files-found: warn
          retention-days: 30

      - name: Report resumable batch continuation
        if: success()
        run: |
          SHOULD_CONTINUE="$(node -e 'const fs=require("node:fs"); const p=JSON.parse(fs.readFileSync("artifacts/unit-drafts/progress.json","utf8")); process.stdout.write(p.autoContinuation?.scheduled ? "true" : "false");' 2>/dev/null || echo false)"
          if [ "$SHOULD_CONTINUE" = "true" ]; then
            echo "::notice::A batch-trigger file was saved. The persistence commit will queue the next run on main."
          else
            echo "::notice::No automatic batch continuation is queued. Remaining blockers and retry times are preserved in progress.json and batch-state.json."
          fi

      - name: Dispatch the next resumable curriculum batch
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const progressPath = 'artifacts/unit-drafts/progress.json';
            const triggerPath = 'artifacts/unit-drafts/batch-trigger.json';
            if (!fs.existsSync(progressPath) || !fs.existsSync(triggerPath)) {
              core.info('No saved batch progress/trigger; no follow-up run will be dispatched.');
              return;
            }
            const progress = JSON.parse(fs.readFileSync(progressPath, 'utf8'));
            const trigger = JSON.parse(fs.readFileSync(triggerPath, 'utf8'));
            if (!progress.autoContinuation?.scheduled || Number(progress.pendingCandidates || 0) < 1) {
              core.info('The latest batch did not qualify for automatic continuation.');
              return;
            }
            if (trigger.repository !== 'mustafaelmenshawy23-jpg/EngliMensh-Egypt') {
              throw new Error('Refusing to dispatch a batch trigger for a different repository.');
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'generate-interactive-unit.yml',
              ref: 'main',
              inputs: {
                start_index: String(trigger.nextCursorIndex ?? progress.nextCursorIndex ?? ''),
                batch_size: String(trigger.batchSize ?? progress.batchSize ?? 10),
                chain_depth: String(trigger.chainDepth ?? 0),
                gemini_model: String(trigger.model ?? progress.model ?? 'gemini-3.8-flash')
              }
            });
            core.notice('Dispatched the next resumable batch on main using workflow_dispatch.');
