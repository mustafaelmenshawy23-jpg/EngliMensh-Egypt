name: Generate interactive curriculum batch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-interactive-curriculum-batch.mjs'
      - 'scripts/extract-pdfs.mjs'
      - 'scripts/ocr-scanned-pages.py'
      - 'scripts/repair-watermark-pages.mjs'
      - 'scripts/lib/extraction-quality.mjs'
      - 'scripts/lib/extraction-cache-health.mjs'
      - 'scripts/check-extraction-cache.mjs'
      - 'scripts/generate-interactive-unit.mjs'
      - 'scripts/lib/curriculum-order.mjs'
      - 'scripts/lib/source-quality-gate.mjs'
      - 'scripts/lib/content-quality-validator.mjs'
      - 'data/curriculum/source-book-index.draft.json'
      - 'src/data/extracted/manifest.json'
      - 'src/data/extracted/pages.jsonl'
      - '.github/workflows/generate-interactive-unit.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      start_index:
        description: Optional zero-based position in the ordered candidate queue; leave empty to resume saved progress
        required: false
        default: ""
        type: string
      batch_size:
        description: Number of units to process in this run (1-10)
        required: true
        default: "5"
        type: string
      gemini_model:
        description: Gemini model
        required: true
        default: gemini-3.8-flash
        type: string

permissions:
  contents: write

concurrency:
  group: englimensh-curriculum-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout only the EngliMensh-Egypt repository and hydrate source PDFs
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Restore reusable source extraction cache
        id: source_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            src/data/extracted/pages.jsonl
            src/data/extracted/manifest.json
          key: englimensh-source-extraction-fullcoverage-v2-${{ hashFiles('public/books/**', 'scripts/extract-pdfs.mjs', 'scripts/ocr-scanned-pages.py', 'scripts/repair-watermark-pages.mjs', 'scripts/lib/extraction-cache-health.mjs', 'scripts/check-extraction-cache.mjs') }}
          restore-keys: |
            englimensh-source-extraction-

      - name: Assess restored extraction cache coverage
        id: extraction_coverage
        run: node scripts/check-extraction-cache.mjs

      - name: Hydrate every original source PDF when cache is incomplete
        if: steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: |
          set -euo pipefail
          if ! git lfs pull; then
            echo "::warning::One or more LFS objects could not be downloaded. Continuing with readable PDFs; missing objects will be recorded as blocked sources."
          fi
          python3 - <<'PY'
          from pathlib import Path
          import sys

          pdfs = sorted(p for p in Path("public/books").rglob("*") if p.is_file() and p.suffix.lower() == ".pdf")
          pointers = []
          invalid = []
          for path in pdfs:
              header = path.read_bytes()[:256]
              if b"git-lfs.github.com/spec" in header:
                  pointers.append(str(path))
              elif not header.startswith(b"%PDF-"):
                  invalid.append(str(path))
          if invalid:
              print(f"::error::Found {len(invalid)} invalid PDF file(s); refusing to extract corrupted sources.")
              for path in invalid[:20]:
                  print(" - Invalid PDF: " + path)
              sys.exit(1)
          if pointers:
              print(f"::warning::Continuing with {len(pdfs) - len(pointers)} hydrated PDF(s); {len(pointers)} source(s) remain blocked by missing LFS objects.")
              for path in pointers:
                  print(" - Blocked LFS source: " + path)
          else:
              print(f"All {len(pdfs)} source PDF files are hydrated and begin with a PDF signature.")
          PY

      - name: Extract all source pages when cache is incomplete
        if: steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: npm run extract:books

      - name: Verify full source extraction coverage
        if: steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: node scripts/check-extraction-cache.mjs --require-complete

      - name: Detect repeated watermark-only text pages
        if: steps.source_cache.outputs.cache-hit != 'true' || steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: node scripts/repair-watermark-pages.mjs

      - name: Hydrate only PDFs with watermark-only pages from a restored cache
        if: steps.extraction_coverage.outputs.needs_full_extraction != 'true' && steps.source_cache.outputs.cache-matched-key != '' && steps.source_cache.outputs.cache-hit != 'true'
        run: |
          if [ -s src/data/extracted/watermark-repair-sources.txt ]; then
            include="$(paste -sd, src/data/extracted/watermark-repair-sources.txt)"
            git lfs pull --include="$include"
          else
            echo "No additional source PDFs are required for watermark OCR."
          fi

      - name: Set up OCR tools for scanned and watermark-only pages
        if: steps.source_cache.outputs.cache-hit != 'true' || steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
          python3 -m venv .venv
          .venv/bin/pip install pymupdf

      - name: OCR scanned and watermark-only pages
        if: steps.source_cache.outputs.cache-hit != 'true' || steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: OCR_LANG=eng+ara OCR_DPI=200 OCR_WORKERS=4 OCR_CHECKPOINT_EVERY=25 .venv/bin/python scripts/ocr-scanned-pages.py

      - name: Validate complete source extraction before generation
        if: steps.source_cache.outputs.cache-hit != 'true' || steps.extraction_coverage.outputs.needs_full_extraction == 'true'
        run: |
          npm run validate:extraction
          node scripts/check-extraction-cache.mjs --require-complete

      - name: Save reusable source extraction cache
        if: steps.source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src/data/extracted/pages.jsonl
            src/data/extracted/manifest.json
          key: ${{ steps.source_cache.outputs.cache-primary-key }}

      - name: Generate resumable ordered unit batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_BACKUP: ${{ secrets.GEMINI_API_KEY_BACKUP }}
          GEMINI_API_KEY_BACKUP_2: ${{ secrets.GEMINI_API_KEY_BACKUP_2 }}
          GEMINI_API_KEY_BACKUP_3: ${{ secrets.GEMINI_API_KEY_BACKUP_3 }}
          GEMINI_MODEL: ${{ github.event.inputs.gemini_model || 'gemini-3.8-flash' }}
          START_INDEX: ${{ github.event.inputs.start_index || '' }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '5' }}
        run: node scripts/generate-interactive-curriculum-batch.mjs

      - name: Persist unapproved drafts and resumable queue state
        if: always()
        run: |
          set -e
          EXTRACTION_BACKUP="$RUNNER_TEMP/englimensh-extracted"
          restore_extraction() {
            if [ -d "$EXTRACTION_BACKUP" ]; then
              mkdir -p src/data/extracted
              cp -a "$EXTRACTION_BACKUP/." src/data/extracted/
            fi
          }
          trap restore_extraction EXIT

          if [ -d src/data/extracted ]; then
            rm -rf "$EXTRACTION_BACKUP"
            mkdir -p "$EXTRACTION_BACKUP"
            cp -a src/data/extracted/. "$EXTRACTION_BACKUP/"
            rm -rf src/data/extracted
            # Restore the committed extraction snapshot before rebasing.
            # The fresh extraction is kept in RUNNER_TEMP and restored by the EXIT trap.
            git restore --source=HEAD --staged --worktree -- src/data/extracted/ || true
            git clean -fd -- src/data/extracted/ || true
          fi

          if [ -d artifacts/unit-drafts ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+users.noreply.github.com"
            git add artifacts/unit-drafts/*.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Save resumable interactive curriculum batch"
              git pull --rebase origin main
              git push
            else
              echo "No draft/progress/state changes to persist."
            fi
          fi

      - name: Upload drafts, blockers, and progress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-curriculum-batch-${{ github.run_number }}
          path: |
            artifacts/unit-drafts/*.json
            src/data/extracted/pages.jsonl
            src/data/extracted/manifest.json
          if-no-files-found: warn
          retention-days: 30
