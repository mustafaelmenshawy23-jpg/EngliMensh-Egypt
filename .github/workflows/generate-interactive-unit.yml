name: Generate interactive curriculum batch

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: Zero-based position in the eligible unit queue (use the previous report to continue)
        required: true
        default: "0"
        type: string
      batch_size:
        description: Number of units to process in this run (1-10)
        required: true
        default: "5"
        type: string
      gemini_model:
        description: Gemini model
        required: true
        default: gemini-3.8-flash
        type: string

permissions:
  contents: write

concurrency:
  group: englimensh-curriculum-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Hydrate source PDFs
        run: git lfs pull
      - name: Extract source pages and OCR scans once for this batch
        run: |
          npm run extract:books
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-ara
          python3 -m venv .venv
          .venv/bin/pip install pymupdf
          OCR_LANG=eng+ara OCR_DPI=200 OCR_WORKERS=4 OCR_CHECKPOINT_EVERY=25 .venv/bin/python scripts/ocr-scanned-pages.py
      - name: Generate resumable unit batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          START_INDEX: ${{ inputs.start_index }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: node scripts/generate-interactive-curriculum-batch.mjs
      - name: Persist unapproved drafts for resumable continuation
        if: always()
        run: |
          if [ -d artifacts/unit-drafts ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull --rebase origin main
            git add artifacts/unit-drafts/*.json 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Save unapproved interactive curriculum drafts"
              git push
            fi
          fi
      - name: Upload drafts and progress report for academic review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-curriculum-batch-${{ inputs.start_index }}
          path: artifacts/unit-drafts/*.json
          if-no-files-found: warn
          retention-days: 30
